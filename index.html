<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuulivoimaennuste</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:40px 20px;
}

h1{
    font-size:clamp(2.5rem,6vw,5rem);
    margin-bottom:30px;
}

.value{
    font-size:clamp(5rem,12vw,10rem);
    font-weight:900;
    line-height:1;
}

.unit{
    font-size:2rem;
    opacity:.85;
    margin-top:10px;
}

.status{
    margin-top:25px;
    font-size:clamp(2rem,5vw,3rem);
    font-weight:800;
}

.deviation{
    margin-top:10px;
    font-size:1.4rem;
    opacity:.95;
}

.price{
    margin-top:40px;
    font-size:2.5rem;
    font-weight:700;
}

.stats{
    margin-top:50px;
    width:100%;
    max-width:1200px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,.08);
    border-radius:14px;
    padding:24px;
}

.card-title{
    opacity:.8;
    margin-bottom:10px;
}

.card-value{
    font-size:2rem;
    font-weight:800;
}

.time{
    position:fixed;
    top:20px;
    right:20px;
    opacity:.8;
}

.footer{
    margin-top:40px;
    opacity:.6;
}

.green{
    color:#00e676;
}

.yellow{
    color:#ffee58;
}

.red{
    color:#ff6b6b;
}
</style>
</head>
<body>

<div class="time" id="time"></div>

<div class="container">

    <h1>🌬️ TUULIVOIMA NYT</h1>

    <div class="value" id="wind">--</div>
    <div class="unit">MW</div>

    <div class="status" id="status">
        Ladataan...
    </div>

    <div class="deviation" id="deviation"></div>

    <div class="price" id="price">
        ⚡ Hinta ei saatavilla
    </div>

    <div class="stats">

        <div class="card">
            <div class="card-title">
                Havaintoja kerätty
            </div>
            <div class="card-value" id="count">
                --
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                Tuulivoiman 24 h keskiarvo
            </div>
            <div class="card-value" id="windAvg">
                --
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                Sähkön hinnan 24 h keskiarvo
            </div>
            <div class="card-value" id="priceAvg">
                --
            </div>
        </div>

    </div>

    <div class="footer">
        Päivitetään automaattisesti
    </div>

</div>

<script>

function updateClock(){
    document.getElementById("time").innerText =
        new Date().toLocaleString("fi-FI");
}

updateClock();
setInterval(updateClock,1000);

async function loadData(){

    try{

        const response =
            await fetch(
                "data/history.json?v=" + Date.now()
            );

        const history =
            await response.json();

        if(!history.length)
            return;

        const latest =
            history[history.length-1];

        document.getElementById("count")
            .innerText = history.length;

        document.getElementById("wind")
            .innerText =
            Math.round(
                latest.windActual
            );

        if(latest.price !== null){

            document.getElementById("price")
                .innerText =
                `⚡ ${latest.price.toFixed(2)} snt/kWh`;
        }

        const last24 =
            history.slice(-24);

        const windValues =
            last24
            .map(x => x.windActual)
            .filter(x => x != null);

        const priceValues =
            last24
            .map(x => x.price)
            .filter(x => x != null);

        const windAvg =
            windValues.reduce(
                (a,b)=>a+b,0
            ) / windValues.length;

        document.getElementById("windAvg")
            .innerText =
            `${Math.round(windAvg)} MW`;

        if(priceValues.length){

            const priceAvg =
                priceValues.reduce(
                    (a,b)=>a+b,0
                ) / priceValues.length;

            document.getElementById("priceAvg")
                .innerText =
                `${priceAvg.toFixed(2)} snt`;
        }

        const deviation =
            (
                (latest.windActual - windAvg)
                / windAvg
            ) * 100;

        let status =
            "🟡 NORMAALI TUULIVOIMA";

        let css =
            "yellow";

        if(deviation > 20){

            status =
                "🟢 VOIMAKAS TUULIVOIMA";

            css =
                "green";
        }

        if(deviation < -20){

            status =
                "🔴 HEIKKO TUULIVOIMA";

            css =
                "red";
        }

        const statusEl =
            document.getElementById("status");

        statusEl.innerText =
            status;

        statusEl.className =
            "status " + css;

        const direction =
            deviation >= 0
            ? "yli"
            : "alle";

        document.getElementById("deviation")
            .innerText =
            `${Math.abs(deviation).toFixed(0)} % ${direction} 24 h keskiarvon`;

    }
    catch(err){

        console.error(err);
    }
}

loadData();

setInterval(
    loadData,
    300000
);

</script>

</body>
</html>
