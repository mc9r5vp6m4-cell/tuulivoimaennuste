name: Collect Energy Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Collect data
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: |

          cat > collect.py << 'EOF'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          HISTORY_FILE = "data/history.json"

          headers = {
              "x-api-key": os.environ["FINGRID_API_KEY"]
          }

          #
          # TUULIVOIMA (Fingrid dataset 181)
          #
          wind_actual = None

          try:

              r = requests.get(
                  "https://data.fingrid.fi/api/datasets/181/data",
                  headers=headers,
                  params={
                      "pageSize": 1
                  },
                  timeout=30
              )

              r.raise_for_status()

              rows = r.json()["data"]

              if rows:
                  wind_actual = rows[0]["value"]

          except Exception as e:

              print(
                  "Wind fetch failed:",
                  str(e)
              )

          #
          # PÖRSSISÄHKÖ
          # SAMA LOGIIKKA KUIN SAHKONAYTTO-PROJEKTISSA
          #
          price = None

          try:

              r = requests.get(
                  "https://sahkonhintahuomenna.fi/api/v1/fi/today.json",
                  timeout=30
              )

              r.raise_for_status()

              data = r.json()

              prices = data.get(
                  "prices",
                  []
              )

              from zoneinfo import ZoneInfo 
              current_hour = datetime.now( 
              ZoneInfo("Europe/Helsinki") 
              ).hour

              hour_rows = []

              for item in prices:

                  try:

                      d = datetime.fromisoformat(
                          item["start"]
                      )

                      if d.hour == current_hour:

                          hour_rows.append(
                              item["cents_per_kWh_incl_vat"]
                          )

                  except Exception:
                      pass

              if hour_rows:

                  price = (
                      sum(hour_rows)
                      / len(hour_rows)
                  )

          except Exception as e:

              print(
                  "Price fetch failed:",
                  str(e)
              )

          #
          # HISTORIARIVI
          #
          row = {
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),

              "price": price,

              "windActual": wind_actual
          }

          #
          # LUE VANHA HISTORY
          #
          try:

              with open(
                  HISTORY_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  history = json.load(f)

          except Exception:

              history = []

          #
          # LISÄÄ UUSI RIVI
          #
          history.append(row)

          # Säilytä viimeiset 10000 riviä
          history = history[-10000:]

          #
          # TALLENNA
          #
          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  row,
                  indent=2,
                  ensure_ascii=False
              )
          )

          EOF

          python collect.py

      - name: Commit changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/history.json

          git diff --staged --quiet || git commit -m "Collect energy data"

          git push
