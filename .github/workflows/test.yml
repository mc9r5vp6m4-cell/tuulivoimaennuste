name: Test Action

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Write timestamp
        run: |
          echo "{\"updated\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/test.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/test.json

          git diff --staged --quiet || git commit -m "Update test timestamp"

          git push
